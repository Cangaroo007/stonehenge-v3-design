<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Wedding Translator 🌸</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#C9A44C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Wedding 🌸" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+JP:wght@200;300;400&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; background: #0C0B0A; }
    @keyframes fadeUp  { from { opacity:0; transform:translateY(14px) } to { opacity:1; transform:translateY(0) } }
    @keyframes shimmer { 0%,100%{opacity:.4} 50%{opacity:1} }
    @keyframes photoIn { from{opacity:0;transform:scale(1.05)} to{opacity:1;transform:scale(1)} }
    @keyframes popIn   { 0%{transform:scale(0);opacity:0} 65%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
    @keyframes float   { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
    @keyframes pulse   { 0%,100%{box-shadow:0 0 0 0 rgba(201,164,76,.55)} 70%{box-shadow:0 0 0 12px rgba(201,164,76,0)} }
    @keyframes glow    { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    button { font-family: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useCallback } = React;

    // ─── Constants ───────────────────────────────────
    const GOLD    = '#C9A44C';
    const CREAM   = '#F7F0E6';
    const POLL_MS = 1500;
    const SLIDE_MS = 7000;

    // ─── API helpers ─────────────────────────────────
    async function apiTranslate(text, fromLang) {
      const r = await fetch('/api/translate', {
        method : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body   : JSON.stringify({ text, fromLang }),
      });
      if (!r.ok) throw new Error('Translation failed');
      return r.json(); // { original, translated, sourceLang, timestamp }
    }

    async function apiState() {
      const r = await fetch('/api/state');
      return r.json(); // { translation, photoIds }
    }

    async function apiGetPhoto(id) {
      const r = await fetch(`/api/photos/${id}`);
      const d = await r.json();
      return d.data; // base64 string
    }

    async function apiUploadPhoto(data) {
      const r = await fetch('/api/photos', {
        method : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body   : JSON.stringify({ data }),
      });
      if (!r.ok) throw new Error('Upload failed');
      return r.json(); // { id, total }
    }

    // ─── Utils ───────────────────────────────────────
    const hasJP = (t) => /[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff]/.test(t);

    async function compressImg(file, maxPx = 1200, q = 0.74) {
      return new Promise((res) => {
        const c = document.createElement('canvas');
        const img = new Image();
        img.onload = () => {
          let [w, h] = [img.width, img.height];
          if (w > maxPx || h > maxPx) {
            if (w > h) { h = (h * maxPx) / w; w = maxPx; }
            else       { w = (w * maxPx) / h; h = maxPx; }
          }
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          res(c.toDataURL('image/jpeg', q));
        };
        img.src = URL.createObjectURL(file);
      });
    }

    // ─── Shared atoms ────────────────────────────────
    function GoldLine({ w = 70 }) {
      return (
        <div style={{ display:'flex', alignItems:'center', gap:10, justifyContent:'center', margin:'1.1rem 0' }}>
          <div style={{ width:w, height:1, background:`linear-gradient(to right,transparent,${GOLD})` }} />
          <span style={{ color:GOLD, fontSize:'0.62rem', letterSpacing:3 }}>✦</span>
          <div style={{ width:w, height:1, background:`linear-gradient(to left,transparent,${GOLD})` }} />
        </div>
      );
    }

    // ═════════════════════════════════════════════════
    // HOME SCREEN
    // ═════════════════════════════════════════════════
    function HomeScreen({ setView }) {
      const url = window.location.origin;
      const qr  = `https://api.qrserver.com/v1/create-qr-code/?size=176x176&color=5C3A1E&bgcolor=F7F0E6&data=${encodeURIComponent(url)}`;

      return (
        <div style={{
          minHeight:'100vh',
          background:`radial-gradient(ellipse at 55% 0%,#f0e4cf 0%,${CREAM} 55%,#ede3d4 100%)`,
          display:'flex', flexDirection:'column',
          alignItems:'center', justifyContent:'center',
          padding:'2.5rem 1.5rem', position:'relative', overflow:'hidden',
          fontFamily:"'Cormorant Garamond', Georgia, serif",
        }}>
          {/* Faint petal backgrounds */}
          {['7%','86%','44%'].map((l,i) => (
            <div key={i} style={{
              position:'absolute', fontSize: i===0?'7rem':'5rem',
              left:l, top:i===1?'10%':undefined, bottom:i===2?'6%':undefined,
              opacity:.06, pointerEvents:'none', transform:`rotate(${i*45}deg)`,
            }}>🌸</div>
          ))}

          {/* Header */}
          <div style={{ textAlign:'center', marginBottom:'2.5rem' }}>
            <div style={{ fontSize:'2.6rem', animation:'float 4s ease-in-out infinite', marginBottom:'1rem' }}>🌸</div>
            <h1 style={{
              fontFamily:"'Playfair Display', serif",
              fontSize:'clamp(1.9rem,5.5vw,3rem)', fontWeight:400,
              color:'#3D2010', letterSpacing:'0.06em', lineHeight:1.15,
            }}>Wedding Translator</h1>
            <p style={{
              fontFamily:"'Noto Serif JP', serif",
              fontSize:'clamp(0.9rem,2.5vw,1.1rem)',
              color:GOLD, marginTop:'0.5rem', letterSpacing:'0.22em',
            }}>結婚式リアルタイム翻訳</p>
            <GoldLine w={55} />
            <p style={{ fontSize:'0.9rem', color:'#8A6A50', fontStyle:'italic', letterSpacing:'0.04em' }}>
              Japanese · English · Live
            </p>
          </div>

          {/* Role cards */}
          <div style={{ display:'flex', flexDirection:'column', gap:'0.9rem', width:'100%', maxWidth:400 }}>
            <HomeCard icon="📽️" title="Projection Display"   sub="Ceremony screen — live translation & photo wall" color="#4A2810" onClick={() => setView('display')} />
            <HomeCard icon="📸" title="Upload a Photo"       sub="Share a moment — appears live on the big screen"  color="#7A4F1A" onClick={() => setView('upload')}  />
            <HomeCard icon="📱" title="Follow Translations"  sub="Read live translations on your own phone"          color="#5A3D6A" onClick={() => setView('guest')}   />
          </div>

          {/* QR code */}
          <div style={{
            marginTop:'2.5rem', background:'white', borderRadius:20,
            padding:'1.4rem', textAlign:'center', maxWidth:248, width:'100%',
            boxShadow:'0 8px 40px rgba(90,50,20,.12)',
            border:`1px solid rgba(201,164,76,.25)`,
          }}>
            <p style={{ fontSize:'0.68rem', color:GOLD, letterSpacing:'0.18em', fontWeight:700, marginBottom:'1rem' }}>
              SHARE WITH GUESTS
            </p>
            <img src={qr} alt="QR Code" style={{ width:140, height:140, borderRadius:10 }} />
            <p style={{
              fontSize:'0.73rem', color:'#999', marginTop:'0.85rem', lineHeight:1.6,
              fontFamily:"'Cormorant Garamond', serif", fontStyle:'italic',
            }}>
              Scan to upload photos<br/>or follow along
            </p>
          </div>
        </div>
      );
    }

    function HomeCard({ icon, title, sub, color, onClick }) {
      const [h, setH] = useState(false);
      return (
        <button onClick={onClick} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
          style={{
            display:'flex', alignItems:'center', gap:'1rem',
            padding:'1.1rem 1.4rem',
            background: h ? color : 'rgba(255,255,255,.92)',
            border:`1.5px solid ${h ? color : 'rgba(201,164,76,.3)'}`,
            borderRadius:16, cursor:'pointer', textAlign:'left', width:'100%',
            boxShadow: h ? `0 12px 32px ${color}55` : '0 2px 12px rgba(0,0,0,.06)',
            transform: h ? 'translateY(-3px)' : 'none',
            transition:'all .22s ease',
          }}>
          <span style={{ fontSize:'1.9rem', flexShrink:0 }}>{icon}</span>
          <div>
            <div style={{
              fontFamily:"'Playfair Display', serif", fontSize:'1.1rem',
              color: h ? 'white' : color, fontWeight:600, letterSpacing:'0.03em',
            }}>{title}</div>
            <div style={{
              fontFamily:"'Cormorant Garamond', serif", fontSize:'0.82rem',
              color: h ? 'rgba(255,255,255,.8)' : '#888', marginTop:'0.2rem',
            }}>{sub}</div>
          </div>
        </button>
      );
    }

    // ═════════════════════════════════════════════════
    // DISPLAY SCREEN  (the projection view)
    // ═════════════════════════════════════════════════
    function DisplayScreen({ setView }) {
      const [trans,    setTrans]    = useState(null);
      const [transKey, setTransKey] = useState(0);
      const [photos,   setPhotos]   = useState([]);
      const [photoIdx, setPhotoIdx] = useState(0);
      const [showCtrl, setShowCtrl] = useState(true);
      const [listening,setListening]= useState(false);
      const [lang,     setLang]     = useState('ja');
      const [status,   setStatus]   = useState('Ready');
      const [interim,  setInterim]  = useState('');
      const [busy,     setBusy]     = useState(false);

      const lisRef     = useRef(false);
      const langRef    = useRef('ja');
      const recRef     = useRef(null);
      const busyRef    = useRef(false);
      const lastRef    = useRef('');
      const sessionRef = useRef(0);
      const knownIds   = useRef(new Set());

      // ── Poll server state ───────────────────────────
      useEffect(() => {
        let alive = true;
        async function poll() {
          if (!alive) return;
          try {
            const s = await apiState();
            // Sync translation
            if (s.translation) {
              setTrans(prev => {
                if (prev?.timestamp === s.translation.timestamp) return prev;
                setTransKey(k => k + 1);
                return s.translation;
              });
            }
            // Sync new photos
            const newIds = (s.photoIds || []).filter(id => !knownIds.current.has(id));
            for (const id of newIds) {
              const data = await apiGetPhoto(id);
              knownIds.current.add(id);
              setPhotos(prev => [...prev, { id, data }]);
            }
          } catch {}
          setTimeout(poll, POLL_MS);
        }
        poll();
        return () => { alive = false; };
      }, []);

      // ── Slideshow ───────────────────────────────────
      useEffect(() => {
        if (photos.length < 2) return;
        const t = setInterval(() => setPhotoIdx(i => (i + 1) % photos.length), SLIDE_MS);
        return () => clearInterval(t);
      }, [photos.length]);

      useEffect(() => {
        if (photos.length > 0 && photoIdx >= photos.length) setPhotoIdx(0);
      }, [photos.length]);

      // ── Dual-language auto-detection ────────────────
      // Runs ja-JP and en-US simultaneously — whichever
      // gets a confident final result first wins.
      const recJA = useRef(null);
      const recEN = useRef(null);

      const stopBoth = useCallback(() => {
        ['recJA','recEN'].forEach(r => {
          try { if (eval(r).current) eval(r).current.stop(); } catch {}
        });
        if (recJA.current) try { recJA.current.stop(); } catch {}
        if (recEN.current) try { recEN.current.stop(); } catch {}
      }, []);

      const startMic = useCallback(() => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { setStatus('Use Chrome for speech recognition'); return; }

        const mySession = ++sessionRef.current;
        lisRef.current  = true;
        setListening(true); setStatus('Listening… (auto-detecting language)');

        function makeRec(lang) {
          const rec          = new SR();
          rec.lang           = lang;
          rec.continuous     = true;
          rec.interimResults = true;

          rec.onresult = async (e) => {
            if (sessionRef.current !== mySession || busyRef.current) return;
            const results = Array.from(e.results);
            const last    = results[results.length - 1];
            const text    = last[0].transcript.trim();

            // Show interim from whichever fires first
            if (!last.isFinal) { setInterim(text); return; }
            if (!text || text === lastRef.current) return;

            // Got a final result — lock, stop both, translate
            busyRef.current = true;
            lastRef.current = text;
            setInterim('');
            setBusy(true);
            setStatus('Translating…');

            // Auto-detect: use Unicode to confirm language
            const detectedLang = hasJP(text) ? 'ja' : 'en';
            setLang(detectedLang);

            // Pause both while translating
            try { recJA.current?.stop(); } catch {}
            try { recEN.current?.stop(); } catch {}

            try {
              const result = await apiTranslate(text, detectedLang);
              setTrans(result);
              setTransKey(k => k + 1);
              setStatus('Listening… (auto-detecting language)');
            } catch { setStatus('Error — will retry'); }
            finally {
              busyRef.current = false;
              setBusy(false);
              // Restart both after translating
              if (lisRef.current && sessionRef.current === mySession) {
                setTimeout(() => {
                  try { recJA.current?.start(); } catch {}
                  try { recEN.current?.start(); } catch {}
                }, 400);
              }
            }
          };

          rec.onerror = (e) => {
            if (e.error === 'no-speech') return;
            if (e.error === 'aborted')   return;
            console.warn(`${lang} mic:`, e.error);
          };

          rec.onend = () => {
            if (sessionRef.current !== mySession || !lisRef.current || busyRef.current) return;
            setTimeout(() => {
              try { rec.start(); } catch {}
            }, 300);
          };

          return rec;
        }

        // Stop any existing
        try { recJA.current?.stop(); } catch {}
        try { recEN.current?.stop(); } catch {}

        recJA.current = makeRec('ja-JP');
        recEN.current = makeRec('en-US');

        setTimeout(() => { try { recJA.current.start(); } catch {} }, 0);
        setTimeout(() => { try { recEN.current.start(); } catch {} }, 150);
      }, []);

      const stopMic = useCallback(() => {
        sessionRef.current++;
        lisRef.current = false;
        setListening(false); setInterim(''); setStatus('Paused');
        try { recJA.current?.stop(); } catch {}
        try { recEN.current?.stop(); } catch {}
      }, []);

      const photo = photos[photoIdx];

      return (
        <div style={{
          height:'100vh', background:'#0C0B0A',
          display:'flex', flexDirection:'column',
          fontFamily:"'Cormorant Garamond', Georgia, serif",
          overflow:'hidden', position:'relative',
        }}>
          {/* ── PHOTO PANEL (top 55%) ─────────────── */}
          <div style={{
            flex:'0 0 55vh', position:'relative',
            display:'flex', alignItems:'center', justifyContent:'center',
            overflow:'hidden', background:'#0C0B0A',
          }}>
            {photo ? (
              <img key={photo.id} src={photo.data} alt="" style={{
                maxWidth:'100%', maxHeight:'55vh', objectFit:'contain',
                animation:'photoIn 1.1s ease',
              }} />
            ) : (
              <div style={{ textAlign:'center', padding:'2rem' }}>
                <div style={{ fontSize:'3.5rem', opacity:.14, marginBottom:'1.2rem' }}>🌸</div>
                <p style={{
                  fontFamily:"'Playfair Display', serif",
                  fontSize:'clamp(.95rem,2.5vw,1.5rem)',
                  color:'#252220', fontStyle:'italic',
                }}>Guest photos will appear here…</p>
                <p style={{
                  fontFamily:"'Noto Serif JP', serif",
                  fontSize:'clamp(.8rem,2vw,1.1rem)',
                  color:'#1e1c1a', marginTop:'0.6rem',
                }}>ゲストの写真がここに表示されます</p>
              </div>
            )}

            {/* Progress dots */}
            {photos.length > 1 && (
              <div style={{
                position:'absolute', bottom:12, left:'50%', transform:'translateX(-50%)',
                display:'flex', gap:6, alignItems:'center',
              }}>
                {photos.slice(0, Math.min(photos.length, 12)).map((p, i) => (
                  <div key={p.id} style={{
                    width: i === photoIdx % Math.min(photos.length,12) ? 20 : 5,
                    height:5, borderRadius:3,
                    background: i === photoIdx % Math.min(photos.length,12) ? GOLD : '#2a2726',
                    transition:'all 0.4s ease',
                  }} />
                ))}
              </div>
            )}

            {/* Gold separator */}
            <div style={{
              position:'absolute', bottom:0, left:0, right:0, height:1,
              background:`linear-gradient(to right,transparent 0%,${GOLD} 25%,${GOLD} 75%,transparent 100%)`,
              opacity:.35,
            }} />
          </div>

          {/* ── TRANSLATION PANEL (bottom 45%) ────── */}
          <div style={{
            flex:1, display:'flex', flexDirection:'column',
            alignItems:'center', justifyContent:'center',
            padding:'1.5rem 5vw', position:'relative',
          }}>
            {/* Top ornament */}
            <div style={{
              position:'absolute', top:'1.1rem', left:'50%', transform:'translateX(-50%)',
              display:'flex', alignItems:'center', gap:8, opacity:.35,
            }}>
              <div style={{ width:44, height:1, background:GOLD }} />
              <span style={{ color:GOLD, fontSize:'0.65rem' }}>✦</span>
              <div style={{ width:44, height:1, background:GOLD }} />
            </div>

            {trans ? (
              <div key={transKey} style={{
                textAlign:'center', width:'100%', maxWidth:1000,
                animation:'fadeUp 0.65s ease',
              }}>
                {/* Original */}
                <p style={{
                  fontFamily: trans.sourceLang==='ja' ? "'Noto Serif JP', serif" : "'Playfair Display', serif",
                  fontSize:'clamp(1.2rem,2.8vw,2.1rem)',
                  color:'#7A6650',
                  fontWeight: trans.sourceLang==='ja' ? 300 : 400,
                  lineHeight:1.65, margin:'0 0 1rem',
                  letterSpacing: trans.sourceLang==='ja' ? '0.07em' : '0.01em',
                }}>{trans.original}</p>

                {/* Arrow */}
                <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:'1rem', marginBottom:'1rem' }}>
                  <div style={{ flex:1, maxWidth:110, height:1, background:`linear-gradient(to right,transparent,${GOLD}55)` }} />
                  <span style={{ color:`${GOLD}77`, fontSize:'1rem' }}>⟷</span>
                  <div style={{ flex:1, maxWidth:110, height:1, background:`linear-gradient(to left,transparent,${GOLD}55)` }} />
                </div>

                {/* Translation */}
                <p style={{
                  fontFamily: trans.sourceLang==='en' ? "'Noto Serif JP', serif" : "'Playfair Display', serif",
                  fontSize:'clamp(1.5rem,3.8vw,3rem)',
                  color:'#F2ECE4',
                  fontWeight: trans.sourceLang==='en' ? 200 : 400,
                  lineHeight:1.65,
                  letterSpacing: trans.sourceLang==='en' ? '0.09em' : '0.02em',
                  fontStyle: trans.sourceLang==='en' ? 'normal' : 'italic',
                }}>{trans.translated}</p>
              </div>
            ) : (
              <div style={{ textAlign:'center' }}>
                {interim ? (
                  <p style={{
                    fontFamily: lang==='ja' ? "'Noto Serif JP', serif" : "'Playfair Display', serif",
                    fontSize:'clamp(1.1rem,3vw,1.8rem)',
                    color:'#2e2b28', fontStyle:'italic',
                    animation:'shimmer 2s infinite',
                  }}>{interim}</p>
                ) : (
                  <>
                    <p style={{
                      fontFamily:"'Playfair Display', serif",
                      fontSize:'clamp(1.1rem,3vw,1.8rem)',
                      color:'#211f1e', fontStyle:'italic',
                    }}>Translation will appear here…</p>
                    <p style={{
                      fontFamily:"'Noto Serif JP', serif",
                      color:'#1c1a19', fontSize:'0.95rem', marginTop:'0.6rem',
                    }}>翻訳がここに表示されます</p>
                  </>
                )}
              </div>
            )}

            {busy && (
              <div style={{
                position:'absolute', bottom:'1.2rem',
                display:'flex', alignItems:'center', gap:8,
              }}>
                <div style={{ width:6, height:6, borderRadius:'50%', background:GOLD, animation:'shimmer 1s infinite' }} />
                <span style={{ color:`${GOLD}99`, fontSize:'0.8rem', fontStyle:'italic' }}>Translating…</span>
              </div>
            )}
          </div>

          {/* ── OPERATOR TOGGLE ──────────────────── */}
          <button onClick={() => setShowCtrl(s => !s)} title="Operator controls" style={{
            position:'fixed', bottom:16, right:16, zIndex:200,
            width:44, height:44, borderRadius:'50%',
            background:'#1a1815', border:`1px solid #2e2c2a`,
            color:GOLD, fontSize:'1.1rem', cursor:'pointer',
            display:'flex', alignItems:'center', justifyContent:'center',
            boxShadow:'0 4px 20px rgba(0,0,0,.6)', transition:'all .2s',
          }}>{showCtrl ? '✕' : '⚙️'}</button>

          {/* ── OPERATOR PANEL ───────────────────── */}
          {showCtrl && (
            <div style={{
              position:'fixed', bottom:68, right:16, zIndex:199,
              background:'#131210', border:'1px solid #282522',
              borderRadius:18, padding:'1.4rem', minWidth:278,
              boxShadow:'0 20px 60px rgba(0,0,0,.85)',
            }}>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'1rem' }}>
                <span style={{ color:GOLD, fontSize:'0.68rem', letterSpacing:'0.18em' }}>OPERATOR</span>
                <button onClick={() => setView('home')} style={{
                  background:'none', border:'none', color:'#555',
                  fontSize:'0.72rem', cursor:'pointer', letterSpacing:'0.08em',
                }}>← HOME</button>
              </div>

              {/* Auto-detect badge */}
              <div style={{
                textAlign:'center', marginBottom:'0.9rem',
                padding:'0.45rem', borderRadius:9,
                background:'#1a1816', border:'1px solid #2a2826',
              }}>
                <span style={{ color:GOLD, fontSize:'0.78rem', letterSpacing:'0.06em' }}>
                  🎌 🇺🇸 &nbsp;Auto-detecting language
                </span>
              </div>

              {/* Mic button */}
              <button onClick={listening ? stopMic : startMic} style={{
                width:'100%', padding:'0.8rem',
                background: listening ? '#6B0000' : '#0F3A14',
                border:'none', borderRadius:11, color:'white',
                fontSize:'1rem', cursor:'pointer',
                display:'flex', alignItems:'center', justifyContent:'center', gap:8,
                transition:'all .2s',
                animation: listening ? 'pulse 2s infinite' : 'none',
              }}>
                <span>{listening ? '🔴' : '🎤'}</span>
                {listening ? 'Stop Listening' : 'Start Listening'}
              </button>

              {/* Status */}
              <p style={{
                color: listening ? '#5ee87a' : '#444',
                fontSize:'0.76rem', textAlign:'center', marginTop:'0.55rem',
                fontFamily:"'Cormorant Garamond', serif",
                animation: listening ? 'shimmer 2.5s infinite' : 'none',
              }}>{status}</p>

              {/* Interim preview */}
              {interim && (
                <div style={{
                  marginTop:'0.75rem', padding:'0.6rem 0.8rem',
                  background:'#1a1816', borderRadius:9, border:'1px solid #282420',
                }}>
                  <p style={{
                    color:GOLD, fontSize:'0.82rem', fontStyle:'italic',
                    fontFamily: lang==='ja' ? "'Noto Serif JP', serif" : "'Cormorant Garamond', serif",
                    lineHeight:1.5,
                  }}>{interim}</p>
                </div>
              )}

              <p style={{ color:'#333', fontSize:'0.72rem', textAlign:'center', marginTop:'0.75rem' }}>
                📸 {photos.length} photo{photos.length!==1?'s':''} on screen
              </p>
            </div>
          )}
        </div>
      );
    }

    // ═════════════════════════════════════════════════
    // UPLOAD SCREEN
    // ═════════════════════════════════════════════════
    function UploadScreen({ setView }) {
      const [uploading, setUploading] = useState(false);
      const [success,   setSuccess]   = useState(false);
      const [count,     setCount]     = useState(0);
      const [err,       setErr]       = useState('');
      const fileRef = useRef(null);

      async function handleFile(e) {
        const file = e.target.files?.[0];
        if (!file || uploading) return;
        setUploading(true); setSuccess(false); setErr('');
        try {
          const b64 = await compressImg(file);
          await apiUploadPhoto(b64);
          setSuccess(true); setCount(c => c + 1);
        } catch { setErr('Upload failed — please try again.'); }
        finally {
          setUploading(false);
          if (fileRef.current) fileRef.current.value = '';
        }
      }

      return (
        <div style={{
          minHeight:'100vh',
          background:`radial-gradient(ellipse at 50% 0%,#f5e8d5 0%,${CREAM} 60%)`,
          display:'flex', flexDirection:'column',
          alignItems:'center', justifyContent:'center',
          padding:'2rem 1.5rem',
          fontFamily:"'Cormorant Garamond', Georgia, serif",
        }}>
          <button onClick={() => setView('home')} style={{
            position:'absolute', top:20, left:20,
            background:'none', border:'none', color:'#B8976A',
            fontSize:'0.85rem', cursor:'pointer', letterSpacing:'0.06em',
          }}>← Back</button>

          <div style={{ textAlign:'center', maxWidth:360, width:'100%' }}>
            <div style={{
              fontSize:'4.5rem', marginBottom:'1.2rem',
              animation: success ? 'popIn 0.55s ease' : 'float 3.5s ease-in-out infinite',
              display:'block',
            }}>{success ? '✨' : '📸'}</div>

            <h2 style={{
              fontFamily:"'Playfair Display', serif",
              fontSize:'2.4rem', fontWeight:400, color:'#3D2010', margin:'0 0 0.4rem',
            }}>{success ? 'Photo Shared!' : 'Share a Moment'}</h2>

            <p style={{
              fontFamily:"'Noto Serif JP', serif",
              color:GOLD, fontSize:'1rem', letterSpacing:'0.15em',
            }}>{success ? '写真が届きました！🌸' : '思い出を共有しましょう'}</p>

            {count > 0 && (
              <p style={{ color:'#C0A882', fontSize:'0.85rem', marginTop:'0.5rem', fontStyle:'italic' }}>
                You've shared {count} photo{count!==1?'s':''} today
              </p>
            )}
            {err && <p style={{ color:'#B03020', fontSize:'0.85rem', marginTop:'0.4rem' }}>{err}</p>}

            <GoldLine />

            <input ref={fileRef} type="file" accept="image/*" capture="environment"
              onChange={handleFile} style={{ display:'none' }} id="ph-in" />

            <label htmlFor="ph-in" style={{
              display:'inline-block', padding:'1rem 2.8rem',
              background: uploading ? '#ccc' : `linear-gradient(135deg, ${GOLD} 0%, #7A4A1A 100%)`,
              color:'white', borderRadius:50,
              cursor: uploading ? 'not-allowed' : 'pointer',
              fontFamily:"'Playfair Display', serif",
              fontSize:'1.15rem', letterSpacing:'0.06em',
              boxShadow:'0 10px 32px rgba(140,90,30,.3)',
              transition:'all .25s',
              pointerEvents: uploading ? 'none' : 'auto',
            }}>
              {uploading ? 'Uploading… ⏳' : success ? 'Share Another 📷' : 'Take or Choose a Photo 📷'}
            </label>

            <p style={{
              fontSize:'0.8rem', color:'#B8976A', marginTop:'1.5rem',
              lineHeight:1.75, fontStyle:'italic',
            }}>
              Your photo will appear live on the<br/>ceremony projection screen
            </p>
          </div>
        </div>
      );
    }

    // ═════════════════════════════════════════════════
    // GUEST VIEW SCREEN
    // ═════════════════════════════════════════════════
    function GuestScreen({ setView }) {
      const [trans,    setTrans]    = useState(null);
      const [transKey, setTransKey] = useState(0);

      useEffect(() => {
        let alive = true;
        async function poll() {
          if (!alive) return;
          try {
            const s = await apiState();
            if (s.translation) {
              setTrans(prev => {
                if (prev?.timestamp === s.translation.timestamp) return prev;
                setTransKey(k => k + 1);
                return s.translation;
              });
            }
          } catch {}
          setTimeout(poll, POLL_MS);
        }
        poll();
        return () => { alive = false; };
      }, []);

      return (
        <div style={{
          minHeight:'100vh', background:'#0E0C0B',
          display:'flex', flexDirection:'column',
          alignItems:'center', justifyContent:'center',
          padding:'2.5rem 1.5rem',
          fontFamily:"'Cormorant Garamond', Georgia, serif",
        }}>
          <button onClick={() => setView('home')} style={{
            position:'absolute', top:20, left:20,
            background:'none', border:'none', color:'#3a3430',
            fontSize:'0.82rem', cursor:'pointer', letterSpacing:'0.06em',
          }}>← Back</button>

          {/* Header */}
          <div style={{ textAlign:'center', marginBottom:'2.5rem' }}>
            <span style={{ color:GOLD, fontSize:'1.4rem', opacity:.55 }}>🌸</span>
            <p style={{ color:'#3a3430', fontSize:'0.7rem', letterSpacing:'0.22em', marginTop:'0.5rem' }}>
              LIVE TRANSLATION
            </p>
            <GoldLine w={40} />
          </div>

          {trans ? (
            <div key={transKey} style={{
              textAlign:'center', maxWidth:500, width:'100%',
              animation:'fadeUp 0.55s ease',
            }}>
              {/* Lang badge */}
              <div style={{
                display:'inline-block', padding:'0.25rem 0.9rem',
                border:`1px solid ${GOLD}33`, borderRadius:20, marginBottom:'1.2rem',
              }}>
                <span style={{ fontSize:'0.72rem', color:`${GOLD}88`, letterSpacing:'0.12em' }}>
                  {trans.sourceLang==='ja' ? '🎌 Japanese → English' : '🇺🇸 English → Japanese'}
                </span>
              </div>

              {/* Original */}
              <p style={{
                fontFamily: trans.sourceLang==='ja' ? "'Noto Serif JP', serif" : "'Playfair Display', serif",
                fontSize:'clamp(1rem,4vw,1.35rem)',
                color:'#6A5640',
                fontWeight: trans.sourceLang==='ja' ? 300 : 400,
                lineHeight:1.75, margin:'0 0 1.2rem',
              }}>{trans.original}</p>

              {/* Divider */}
              <div style={{ display:'flex', alignItems:'center', gap:'0.75rem', marginBottom:'1.2rem' }}>
                <div style={{ flex:1, height:1, background:`${GOLD}1a` }} />
                <span style={{ color:`${GOLD}44`, fontSize:'0.8rem' }}>⟷</span>
                <div style={{ flex:1, height:1, background:`${GOLD}1a` }} />
              </div>

              {/* Translation */}
              <p style={{
                fontFamily: trans.sourceLang==='en' ? "'Noto Serif JP', serif" : "'Playfair Display', serif",
                fontSize:'clamp(1.25rem,5vw,1.85rem)',
                color:'#EEE7DC',
                fontWeight: trans.sourceLang==='en' ? 200 : 400,
                lineHeight:1.8,
                fontStyle: trans.sourceLang==='en' ? 'normal' : 'italic',
                letterSpacing: trans.sourceLang==='en' ? '0.09em' : '0.02em',
              }}>{trans.translated}</p>
            </div>
          ) : (
            <div style={{ textAlign:'center' }}>
              <div style={{ fontSize:'2rem', marginBottom:'1rem', animation:'float 4s ease-in-out infinite', opacity:.25 }}>🌸</div>
              <p style={{ fontFamily:"'Playfair Display', serif", fontSize:'1.3rem', color:'#2a2724', fontStyle:'italic' }}>
                Ceremony hasn't started yet…
              </p>
              <p style={{ fontFamily:"'Noto Serif JP', serif", color:'#222', fontSize:'0.95rem', marginTop:'0.6rem' }}>
                式はまだ始まっていません
              </p>
            </div>
          )}

          {/* Quick photo upload link */}
          <button onClick={() => setView('upload')} style={{
            position:'fixed', bottom:24, right:24,
            background:`${GOLD}18`, border:`1px solid ${GOLD}44`,
            borderRadius:50, padding:'0.5rem 1.1rem',
            color:GOLD, fontSize:'0.8rem', cursor:'pointer',
            letterSpacing:'0.06em',
          }}>📸 Upload photo</button>
        </div>
      );
    }

    // ═════════════════════════════════════════════════
    // ROOT APP
    // ═════════════════════════════════════════════════
    function App() {
      const [view, setView] = useState('home');
      return (
        <>
          {view === 'home'    && <HomeScreen    setView={setView} />}
          {view === 'display' && <DisplayScreen setView={setView} />}
          {view === 'upload'  && <UploadScreen  setView={setView} />}
          {view === 'guest'   && <GuestScreen   setView={setView} />}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
